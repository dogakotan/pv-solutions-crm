name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  # NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY hem build hem
  # e2e testleri için gerekli — bunlar tarayıcıya açık, güvenli (RLS ile
  # korunur) değerler olduğundan repo Variables olarak eklenmesi yeterli
  # (Settings > Secrets and variables > Actions > Variables). Eklenene
  # kadar bu job env eksikliğinden başarısız olur.
  # E2E_TEST_EMAIL / E2E_TEST_PASSWORD / SUPABASE_SERVICE_ROLE_KEY kimlik
  # doğrulanmış akışlar (lead/partner/teklif/çalışan oluşturma) için gerekli
  # ve hassas oldukları için repo Secrets olarak eklenmeli (Settings >
  # Secrets and variables > Actions > Secrets) — Variables'tan farklı olarak
  # loglarda maskelenir. Eklenene kadar bu testler CI'da kendini skip eder
  # (bkz. e2e/*.spec.ts içindeki test.skip koşulları), build/smoke testleri
  # etkilenmez.
  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
